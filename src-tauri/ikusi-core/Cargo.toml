[package]
name = "ikusi-core"
version = "0.1.0"
edition = "2021"
description = "Lógica de reproducción de Ikusi: análisis con ffprobe, decisión directo/remux/transcodificación, sesiones HLS y servidor local"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "net", "sync", "time", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2"] }
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
