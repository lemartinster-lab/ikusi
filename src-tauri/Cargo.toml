[workspace]
members = [".", "ikusi-core"]
resolver = "2"

[package]
name = "ikusi"
version = "0.1.0"
description = "Ikusi — reproductor multimedia personal"
authors = ["lemartinster-lab"]
edition = "2021"

[lib]
name = "ikusi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ikusi-core = { path = "ikusi-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
