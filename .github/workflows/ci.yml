name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Tests del frontend
        run: pnpm test

      # ffmpeg real para la prueba de extremo a extremo del núcleo
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Solo el núcleo: la capa Tauri necesita WebKitGTK y no aporta tests.
      - name: Tests del núcleo (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml -p ikusi-core
